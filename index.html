<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Прогностика 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#b50000;
    --gold-1:#fff3c4; --gold-2:#f6d27a; --gold-3:#d9a441; --gold-4:#a8741c;
    --ease-out:cubic-bezier(.16,1,.3,1);
  }
  html,body{margin:0;height:100%;background:#b50202;overflow:hidden}
  #wrap{position:fixed;inset:0;overflow:hidden;background:#b50202}

  /* Сцена 640x1280, масштабируется под экран (cover) */
  #stage{position:absolute;left:0;top:0;width:640px;height:1280px;
         transform-origin:0 0;overflow:hidden;background:var(--red)}
  #zoom{position:absolute;inset:0;transform-origin:50% 55%}
  #zoom img{position:absolute;display:block;user-select:none;-webkit-user-drag:none}
  #bg{left:0;top:0;width:640px;height:1280px}

  /* ── облака: внешний слой «влетает», внутренний — вечно плывёт ── */
  .fly{position:absolute;opacity:0;will-change:transform,opacity}
  .fly .float{will-change:transform}
  .play .fly{animation:fly 2.3s var(--ease-out) forwards;animation-delay:var(--d,0s)}
  .play .fly .float{animation:float var(--ft,7s) ease-in-out infinite alternate;animation-delay:var(--fd,0s)}
  @keyframes fly{
    0%{opacity:0;transform:translate3d(var(--fx),var(--fy),0) scale(.94)}
    35%{opacity:1}
    100%{opacity:1;transform:translate3d(0,0,0) scale(1)}
  }
  @keyframes float{
    from{transform:translate3d(0,0,0)}
    to  {transform:translate3d(var(--ax),var(--ay),0)}
  }

  /* лёгкая «камера»: чуть приближено → отъезд */
  .play #zoom{animation:zoom 2.6s var(--ease-out) both}
  @keyframes zoom{from{transform:scale(1.08)}to{transform:scale(1)}}

  /* ── виньетка для глубины ── */
  #vig{position:absolute;inset:0;pointer-events:none;
       background:radial-gradient(120% 80% at 50% 45%,transparent 55%,rgba(70,0,0,.35) 100%)}

  /* ── текст ── */
  #title{position:absolute;left:0;right:0;top:350px;text-align:center;
         font-family:'Yeseva One','Playfair Display',Georgia,serif;
         filter:drop-shadow(0 3px 0 rgba(110,0,0,.55)) drop-shadow(0 8px 18px rgba(60,0,0,.55));
         pointer-events:none}
  .word{display:block;white-space:nowrap}
  #w1{font-size:54px;letter-spacing:.07em;line-height:1;margin-right:-.07em}
  #w2{font-size:168px;letter-spacing:.04em;line-height:1;margin-top:6px;margin-right:-.04em}
  .ch{display:inline-block;position:relative;opacity:0;
      color:transparent;
      background:linear-gradient(180deg,var(--gold-1) 0%,var(--gold-2) 30%,var(--gold-3) 62%,var(--gold-4) 100%);
      -webkit-background-clip:text;background-clip:text;
      transform:translateY(26px) scale(.92);filter:blur(10px)}
  .ch::after{content:attr(data-c);position:absolute;left:0;top:0;color:transparent;
      background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.95) 50%,transparent 62%);
      background-size:300% 100%;background-position:130% 0;
      -webkit-background-clip:text;background-clip:text}
  .play .ch{animation:letter .9s var(--ease-out) forwards;animation-delay:var(--cd)}
  .play .ch::after{animation:shine 1.1s ease-in-out forwards;animation-delay:var(--sd)}
  @keyframes letter{to{opacity:1;transform:none;filter:blur(0)}}
  @keyframes shine{from{background-position:130% 0}to{background-position:-30% 0}}
  #w2 .ch{transform:translateY(40px) scale(.7)}

  /* искры */
  .sp{position:absolute;width:var(--s);height:var(--s);pointer-events:none;opacity:0;
      background:radial-gradient(circle,#fff 0 12%,rgba(255,230,150,.9) 30%,transparent 70%);
      clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%)}
  .play .sp{animation:tw 2.2s ease-in-out infinite;animation-delay:var(--td)}
  @keyframes tw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}

  @media (prefers-reduced-motion:reduce){
    .play .fly,.play .ch{animation-duration:.01s;animation-delay:0s}
    .play .fly .float,.play .sp,.play #zoom{animation:none}
  }

  /* ───────── после заставки: минимализм ───────── */
  :root{--cream:#f4e8d2;--ink:#4a2a1a;--ink2:#7a5a3e;--wine:#6a1010;--gold-txt:#f3deaa}
  #stage{transition:filter .9s ease}
  .months-on #stage{filter:blur(6px) brightness(.46) saturate(.95)}
  .months-on #title,.months-on #sparks{opacity:0;transition:opacity .5s ease}
  @keyframes cardin{to{opacity:1;transform:none}}

  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;overflow-y:auto;
          padding:max(env(safe-area-inset-top),24px) 20px max(env(safe-area-inset-bottom),24px);
          opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s ease,visibility 0s .35s;
          font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
          color:#fff3d6;-webkit-tap-highlight-color:transparent}
  .months-on.birth-on #birth,
  .months-on:not(.birth-on):not(.fc-on) #months,
  .months-on.fc-on #forecast{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .6s ease .2s}
  .in{width:100%;max-width:420px;margin:auto 0}
  .t1{font-family:'Yeseva One',Georgia,serif;font-weight:400;text-align:center;color:var(--gold-txt);
      font-size:clamp(26px,7.6vw,32px);line-height:1.2;margin:0 0 28px}

  .btn{appearance:none;-webkit-appearance:none;font:inherit;display:block;width:100%;height:54px;border:0;border-radius:16px;
       font-size:17px;font-weight:600;cursor:pointer;background:var(--cream);color:var(--wine);transition:transform .15s,opacity .25s}
  .btn:active{transform:scale(.98)}
  .btn[disabled]{opacity:.4;cursor:default}
  .btn.dark{background:#8c1010;color:#fff3d6}
  .btn:focus-visible,.link:focus-visible,.back:focus-visible,.mon:focus-visible{outline:2px solid var(--gold-txt);outline-offset:2px}
  .link{appearance:none;-webkit-appearance:none;background:none;border:0;font:inherit;width:100%;height:48px;margin-top:6px;color:var(--ink2);font-size:16px;cursor:pointer}

  /* рулетка даты */
  .wheel{position:relative;display:grid;grid-template-columns:1fr 1.9fr 1.3fr;height:220px;
         -webkit-mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent);mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent)}
  .wheel::before{content:"";position:absolute;left:0;right:0;top:88px;height:44px;pointer-events:none;
         border-top:1px solid rgba(243,222,170,.55);border-bottom:1px solid rgba(243,222,170,.55)}
  .col{height:220px;overflow-y:scroll;scroll-snap-type:y mandatory;padding:88px 0;box-sizing:border-box;
       scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .col::-webkit-scrollbar{display:none}
  .it{height:44px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;scroll-snap-stop:always;
      font-size:20px;color:rgba(255,240,215,.38);cursor:pointer;transition:color .15s;user-select:none;-webkit-user-select:none}
  .it.on{color:#fff3d6;font-weight:600}
  .b-hint{text-align:center;font-size:15px;line-height:1.45;color:rgba(255,240,215,.85);margin:24px 0;min-height:44px}

  /* подтверждение */
  .sheet{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;background:rgba(20,0,0,.55);
         opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s;z-index:5}
  .sheet.show{opacity:1;visibility:visible;transition:opacity .3s}
  .sheet-box{width:100%;max-width:440px;background:var(--cream);color:var(--ink);border-radius:24px 24px 0 0;
         padding:28px 22px max(env(safe-area-inset-bottom),22px);transform:translateY(40px);transition:transform .4s var(--ease-out)}
  .sheet.show .sheet-box{transform:none}
  .sheet-date{font-family:'Yeseva One',Georgia,serif;font-size:28px;line-height:1.2;text-align:center;margin:0 0 8px;color:var(--wine)}
  .sheet-note{text-align:center;font-size:15px;line-height:1.45;color:var(--ink2);margin:0 0 22px}

  /* месяцы */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .mon{appearance:none;-webkit-appearance:none;font:inherit;font-family:'Yeseva One',Georgia,serif;font-size:clamp(15px,4.3vw,17px);
       color:#fff3d6;cursor:pointer;min-height:64px;padding:0 4px;border-radius:16px;border:1px solid rgba(243,222,170,.4);background:transparent;
       opacity:0;transform:translateY(10px);transition:transform .18s,background .2s,color .2s,border-color .2s}
  .months-on:not(.birth-on) .mon{animation:cardin .6s var(--ease-out) forwards;animation-delay:calc(.2s + var(--i) * 40ms)}
  .mon:active{transform:scale(.96)}
  .mon[aria-pressed="true"]{background:var(--cream);color:var(--wine);border-color:var(--cream)}

  /* прогноз */
  #forecast .in{margin:0 auto}
  .back{appearance:none;-webkit-appearance:none;background:none;border:0;font:inherit;display:flex;align-items:center;height:44px;padding:0 8px 0 0;
        color:var(--gold-txt);font-size:16px;cursor:pointer}
  .f-note{text-align:center;font-size:14.5px;line-height:1.45;color:rgba(255,240,215,.85);margin:-14px 0 6px}
  .f-test{text-align:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(243,222,170,.6);margin:0 0 22px}
  .card{background:var(--cream);color:var(--ink);border-radius:20px;padding:20px;margin-bottom:12px}
  .card h3{margin:0 0 8px;font-family:'Yeseva One',Georgia,serif;font-weight:400;font-size:18px;line-height:1.25;color:var(--wine)}
  .card .txt{margin:0;font-size:15.5px;line-height:1.6}
  .fc-on .rv{opacity:0;animation:cardin .6s var(--ease-out) forwards;animation-delay:calc(.2s + var(--r,0) * 70ms)}

  @media (prefers-reduced-motion:reduce){.months-on:not(.birth-on) .mon,.fc-on .rv{animation-duration:.01s;animation-delay:0s}}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="zoom">
    <img id="bg" src="anim/bg.jpg" alt="">

    <!-- облака (позиции взяты из исходной картинки) -->
    <div class="fly" style="left:0;top:0;--fx:-150px;--fy:-90px;--d:0s">
      <div class="float" style="--ax:-12px;--ay:-8px;--ft:7s"><img src="anim/tl.png" alt="" style="width:404px"></div></div>
    <div class="fly" style="left:450px;top:0;--fx:160px;--fy:-70px;--d:.1s">
      <div class="float" style="--ax:11px;--ay:-7px;--ft:6s;--fd:-2s"><img src="anim/tr.png" alt="" style="width:190px"></div></div>
    <div class="fly" style="left:423px;top:161px;--fx:190px;--fy:30px;--d:.05s">
      <div class="float" style="--ax:12px;--ay:-9px;--ft:8s;--fd:-1s"><img src="anim/right.png" alt="" style="width:217px"></div></div>
    <div class="fly" style="left:0;top:700px;--fx:-170px;--fy:60px;--d:.15s">
      <div class="float" style="--ax:-14px;--ay:-5px;--ft:5.5s;--fd:-3s"><img src="anim/swirl.png" alt="" style="width:179px"></div></div>
    <div class="fly" style="left:0;top:785px;--fx:-190px;--fy:40px;--d:.2s">
      <div class="float" style="--ax:-11px;--ay:6px;--ft:7.5s;--fd:-4s"><img src="anim/left.png" alt="" style="width:224px"></div></div>

    <div id="vig"></div>
    <div id="sparks"></div>
    <div id="title">
      <span class="word" id="w1" aria-label="Прогностика"></span>
      <span class="word" id="w2" aria-label="2027"></span>
    </div>
  </div>
</div>

  <section id="forecast" class="screen" aria-label="Прогноз"><div class="in">
    <button class="back" id="back" type="button">‹&nbsp; Місяці</button>
    <h2 class="t1" id="f-title"></h2>
    <p class="f-note" id="f-note"></p>
    <p class="f-test">Тестові дані</p>
    <div id="f-body"></div>
  </div></section>
  <section id="birth" class="screen" aria-label="Дата народження"><div class="in">
    <h1 class="t1">Вкажи дату народження</h1>
    <div class="wheel" role="group" aria-label="Дата народження">
      <div class="col" id="cd" aria-label="День"></div><div class="col" id="cm" aria-label="Місяць"></div><div class="col" id="cy" aria-label="Рік"></div>
    </div>
    <p class="b-hint" id="bhint" aria-live="polite"></p>
    <button class="btn" id="bgo" type="button">Продовжити</button>
  </div></section>
  <section id="months" class="screen" aria-label="Вибір місяця"><div class="in">
    <h1 class="t1">Обирай місяць, щоб отримати прогноз</h1>
    <div class="grid" id="grid" role="group" aria-label="Місяць 2027 року"></div>
  </div></section>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-date"><div class="sheet-box">
    <p class="sheet-date" id="sheet-date"></p>
    <p class="sheet-note">Змінити дату потім буде неможливо.<br>Перевір, чи все правильно.</p>
    <button class="btn dark" id="ok" type="button">Так, усе вірно</button>
    <button class="link" id="fix" type="button">Виправити</button>
  </div></div>
</div>

<script>
(function(){
  var stage=document.getElementById('stage');
  function fit(){
    var r=document.getElementById('wrap').getBoundingClientRect(),w=r.width||innerWidth,h=r.height||innerHeight;
    var s=Math.max(w/640,h/1280)*1.015;
    stage.style.transform='translate('+((w-640*s)/2)+'px,'+((h-1280*s)/2)+'px) scale('+s+')';
  }
  addEventListener('resize',fit);addEventListener('load',fit);
  if(window.ResizeObserver)new ResizeObserver(fit).observe(document.getElementById('wrap'));
  if(window.visualViewport)visualViewport.addEventListener('resize',fit);
  fit();

  function build(id,text,t0,step){
    var el=document.getElementById(id);el.textContent='';
    text.split('').forEach(function(c,i){
      var s=document.createElement('span');s.className='ch';s.dataset.c=c;s.textContent=c;
      s.style.setProperty('--cd',(t0+i*step)+'s');
      s.style.setProperty('--sd',(t0+1.0+i*.07)+'s');
      el.appendChild(s);
    });
  }
  build('w1','ПРОГНОСТИКА',.55,.055);
  build('w2','2027',1.05,.12);

  // искры вокруг текста
  var sp=document.getElementById('sparks');
  var pts=[[110,410],[540,395],[70,560],[575,540],[200,350],[450,345],[320,320],[130,690],[520,660],[300,640],[600,480],[40,480]];
  pts.forEach(function(p,i){
    var d=document.createElement('div');d.className='sp';
    d.style.left=p[0]+'px';d.style.top=p[1]+'px';
    d.style.setProperty('--s',(14+(i%4)*7)+'px');
    d.style.setProperty('--td',(1.6+i*.23)+'s');
    sp.appendChild(d);
  });

  function play(){
    stage.classList.remove('play');void stage.offsetWidth;stage.classList.add('play');
  }
  window.replay=play;
  var wrap=document.getElementById('wrap'),timer,started=false;
  var MONTHS=['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
  var GEN=['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
  var ABBR=GEN;
  var DAYS=[31,28,31,30,31,30,31,31,30,31,30,31];
  function rnd(i,k){var x=Math.sin((i+1)*12.9898+k*78.233)*43758.5453;return x-Math.floor(x)}
  function pick(seed,n,k0,cnt,used){var out=[],k=k0;while(out.length<cnt){var d=Math.floor(rnd(seed,k++)*n);if(out.indexOf(d)<0&&used.indexOf(d)<0)out.push(d)}return out.sort(function(a,b){return a-b})}
  function $(id){return document.getElementById(id)}

  // ── дата народження: збереження (змінити не можна) ──
  var birth=null,DEMO={d:10,m:3,y:1995};
  function validDate(d,m,y){var dt=new Date(y,m-1,d);return dt.getFullYear()===y&&dt.getMonth()===m-1&&dt.getDate()===d&&dt<=new Date()}
  function loadBirth(){try{var v=JSON.parse(localStorage.getItem('prog_birth'));if(v&&validDate(v.d,v.m,v.y))return v}catch(e){}return null}
  function saveBirth(v){try{localStorage.setItem('prog_birth',JSON.stringify(v))}catch(e){}}
  function clearBirth(){try{localStorage.removeItem('prog_birth')}catch(e){}birth=null}

  // період дії прогнозу на місяць i (2027): після 15-го — від дня народження, інакше календарний місяць
  function period(i,D){
    D=D||birth.d;
    if(D<=15)return {s:new Date(2027,i,1),e:new Date(2027,i+1,0)};
    var ey=i===11?2028:2027,em=(i+1)%12;
    return {s:new Date(2027,i,Math.min(D,DAYS[i])),e:new Date(ey,em,Math.min(D,new Date(ey,em+1,0).getDate()))};
  }
  function fmtLong(dt){return dt.getDate()+' '+GEN[dt.getMonth()]}
  function periodText(p){return 'з '+fmtLong(p.s)+' по '+fmtLong(p.e)+(p.e.getFullYear()!==2027?' '+p.e.getFullYear():'')}

  // ── прогноз (тестові дані) ──
  function buildForecast(i){
    var p=period(i),dates=[];
    for(var t=new Date(p.s);t<=p.e;t.setDate(t.getDate()+1))dates.push(new Date(t));
    var seed=i+birth.d*7+birth.m*13;
    var gi=pick(seed,dates.length,30,4,[]),wi=pick(seed,dates.length,60,2,gi);
    var list=function(ix){return ix.map(function(k){return fmtLong(dates[k])}).join(', ')};
    $('f-title').textContent=MONTHS[i]+' 2027';
    $('f-note').textContent='Твій прогноз діє '+periodText(p);
    var blocks=[
      ['Загальний прогноз','Це тестовий текст. Тут буде загальний опис періоду: головна тема, настрій і напрямок, у якому рухатимуться події. Перші дні варто провести спокійно, зібрати думки та визначити пріоритети, а ближче до середини періоду з’явиться більше енергії для активних дій і нових розмов.'],
      ['Кохання та стосунки','Тестовий текст. Тут буде прогноз для особистого життя: як складатимуться стосунки з близькою людиною, чи варто очікувати нових знайомств і на що звернути увагу в розмовах. Найкраще працюватимуть щирість і готовність слухати, а не лише говорити.'],
      ['Гроші та фінанси','Тестовий текст. Тут буде порада щодо доходів і витрат: коли доречно робити великі покупки, а коли краще почекати, чи з’являться додаткові джерела прибутку. Радимо не поспішати з рішеннями, які неможливо скасувати, і звіряти плани з реальними цифрами.'],
      ['Робота та кар’єра','Тестовий текст. Тут буде прогноз щодо роботи й проєктів: які завдання вдаватимуться легше, де знадобиться терпіння і коли добре просити про підвищення або запускати нову справу. Підтримка колег і чітка комунікація допоможуть швидше досягти результату.'],
      ['Здоров’я та самопочуття','Тестовий текст. Тут буде порада щодо енергії, сну й відновлення. Варто звернути увагу на режим дня, достатню кількість води та прогулянки на свіжому повітрі. Невеликі перерви протягом дня дадуть більше користі, ніж довгий відпочинок наприкінці періоду.'],
      ['Ключові дати','Тестовий текст. Сприятливі дні: '+list(gi)+'. У ці дні легше починати нове, домовлятися та приймати важливі рішення. Дні для обережності: '+list(wi)+'. Краще не планувати на них складних розмов і не поспішати з підписанням документів.'],
      ['Порада періоду','Тестовий текст. Тут буде одна головна порада на цей період: коротка думка, яку легко запам’ятати й повертатися до неї щоразу, коли потрібна підтримка.']
    ];
    $('f-body').innerHTML=blocks.map(function(x,k){
      return '<article class="card rv" style="--r:'+k+'"><h3>'+x[0]+'</h3><p class="txt">'+x[1]+'</p></article>';
    }).join('');
    $('forecast').scrollTop=0;
  }

  // ── рулетка дати ──
  var ITEM=44,Y0=1940,Y1=new Date().getFullYear(),cd=$('cd'),cm=$('cm'),cy=$('cy'),bgo=$('bgo'),bhint=$('bhint'),wheelsReady=false;
  function dim(y,m){return new Date(y,m,0).getDate()}
  function mark(col){
    var i=Math.max(0,Math.min(col._n-1,Math.round(col.scrollTop/ITEM)));
    for(var k=0;k<col.children.length;k++)col.children[k].classList.toggle('on',k===i);
    return i;
  }
  function fill(col,labels,idx){
    col._n=labels.length;
    col.innerHTML=labels.map(function(t,k){return '<div class="it" data-i="'+k+'">'+t+'</div>'}).join('');
    col.scrollTop=idx*ITEM;mark(col);
  }
  function sel(){return {d:mark(cd)+1,m:mark(cm)+1,y:Y0+mark(cy)}}
  function dayLabels(n){var a=[];for(var k=1;k<=n;k++)a.push(k);return a}
  function onSettle(){
    var v=sel(),n=dim(v.y,v.m);
    if(n!==cd._n){fill(cd,dayLabels(n),Math.min(v.d,n)-1);v=sel()}
    var ok=validDate(v.d,v.m,v.y);
    bgo.disabled=!ok;
    bhint.textContent=ok?'Твій прогноз діятиме з '+(v.d>15?v.d:1)+'-го числа кожного місяця':'Обери дату в минулому';
  }
  function initWheels(){
    if(wheelsReady)return;wheelsReady=true;
    var years=[];for(var y=Y0;y<=Y1;y++)years.push(y);
    fill(cm,MONTHS,5);fill(cy,years,1995-Y0);fill(cd,dayLabels(dim(1995,6)),14);
    [cd,cm,cy].forEach(function(col){
      var raf=0,to=0;
      col.addEventListener('scroll',function(){
        if(!raf)raf=requestAnimationFrame(function(){raf=0;mark(col)});
        clearTimeout(to);to=setTimeout(onSettle,110);
      },{passive:true});
      col.addEventListener('click',function(e){
        var it=e.target.closest&&e.target.closest('.it');
        if(it)col.scrollTo({top:(+it.dataset.i)*ITEM,behavior:'smooth'});
      });
    });
    onSettle();
  }

  // ── підтвердження ──
  var sheet=$('sheet'),pending=null;
  function openSheet(){
    pending=sel();if(!validDate(pending.d,pending.m,pending.y))return;
    $('sheet-date').textContent=pending.d+' '+GEN[pending.m-1]+' '+pending.y;
    sheet.classList.add('show');$('ok').focus();
  }
  function closeSheet(){sheet.classList.remove('show')}
  bgo.addEventListener('click',openSheet);
  $('fix').addEventListener('click',closeSheet);
  sheet.addEventListener('click',function(e){if(e.target===sheet)closeSheet()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});
  $('ok').addEventListener('click',function(){
    birth=pending;saveBirth(birth);closeSheet();
    try{window.Telegram.WebApp.HapticFeedback.notificationOccurred('success')}catch(x){}
    showMonths();
  });

  // ── місяці ──
  var grid=$('grid');
  function renderMonths(){
    grid.innerHTML='';
    MONTHS.forEach(function(name,i){
      var b=document.createElement('button');b.type='button';b.className='mon';b.setAttribute('aria-pressed','false');
      b.style.setProperty('--i',i);b.textContent=name;
      b.addEventListener('click',function(){
        b.setAttribute('aria-pressed','true');
        try{window.Telegram.WebApp.HapticFeedback.selectionChanged()}catch(e){}
        setTimeout(function(){showForecast(i);b.setAttribute('aria-pressed','false')},180);
      });
      grid.appendChild(b);
    });
  }

  function showBirth(){
    clearTimeout(timer);initWheels();
    wrap.classList.add('months-on','birth-on');wrap.classList.remove('fc-on');
    history.replaceState(null,'',location.pathname+location.search);
  }
  function showMonths(){
    clearTimeout(timer);
    if(!birth)birth=loadBirth()||DEMO;
    renderMonths();
    wrap.classList.remove('birth-on','fc-on');wrap.classList.add('months-on');
  }
  function showForecast(i){
    if(!birth)birth=loadBirth()||DEMO;
    buildForecast(i);
    wrap.classList.remove('birth-on');wrap.classList.add('months-on','fc-on');
    history.replaceState(null,'','#m'+(i+1));
  }
  function backToMonths(){wrap.classList.remove('fc-on');history.replaceState(null,'',location.pathname+location.search)}
  $('back').addEventListener('click',backToMonths);
  // дата вже збережена → пропускаємо її введення; #birth скидає збережену дату (для демо)
  function afterSplash(){if(loadBirth())showMonths();else showBirth()}
  window.showMonths=showMonths;window.showForecast=showForecast;window.showBirth=showBirth;

  // тап по заставці пропускає її
  document.addEventListener('click',function(){
    if(started&&!wrap.classList.contains('months-on')&&location.hash!=='#splash')afterSplash();
  });

  // ── запуск: шрифт + картинки → заставка, через 2,5 с — далі ──
  var h=location.hash,mm=/^#m(\d{1,2})$/.exec(h);
  function imgsReady(){
    var p=[].map.call(document.images,function(im){return im.decode?im.decode().catch(function(){}):Promise.resolve()});
    return Promise.all(p);
  }
  function fontReady(){
    var f=(document.fonts&&document.fonts.load)?document.fonts.load('60px "Yeseva One"','ПРОГНОСТИКАпрогноз2027іїє').catch(function(){}):Promise.resolve();
    return Promise.race([f,new Promise(function(r){setTimeout(r,2500)})]);
  }
  if(h==='#birth')clearBirth();
  Promise.all([fontReady(),imgsReady()]).then(function(){
    play();started=true;
    if(mm&&+mm[1]>=1&&+mm[1]<=12){showForecast(+mm[1]-1)}
    else if(h==='#months'){showMonths()}
    else if(h==='#birth'){showBirth()}
    else if(h!=='#splash'){timer=setTimeout(afterSplash,2500)}
  });
})();
</script>
</body>
</html>
