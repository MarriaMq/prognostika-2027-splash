<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Прогностика 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#b50000;
    --gold-1:#fff3c4; --gold-2:#f6d27a; --gold-3:#d9a441; --gold-4:#a8741c;
    --ease-out:cubic-bezier(.16,1,.3,1);
  }
  html,body{margin:0;height:100%;background:#b50202;overflow:hidden}
  #wrap{position:fixed;inset:0;overflow:hidden;background:#b50202}

  /* Сцена 640x1280, масштабируется под экран (cover) */
  #stage{position:absolute;left:0;top:0;width:640px;height:1280px;
         transform-origin:0 0;overflow:hidden;background:var(--red)}
  #zoom{position:absolute;inset:0;transform-origin:50% 55%}
  #zoom img{position:absolute;display:block;user-select:none;-webkit-user-drag:none}
  #bg{left:0;top:0;width:640px;height:1280px}

  /* ── облака: внешний слой «влетает», внутренний — вечно плывёт ── */
  .fly{position:absolute;opacity:0;will-change:transform,opacity}
  .fly .float{will-change:transform}
  .play .fly{animation:fly 2.3s var(--ease-out) forwards;animation-delay:var(--d,0s)}
  .play .fly .float{animation:float var(--ft,7s) ease-in-out infinite alternate;animation-delay:var(--fd,0s)}
  @keyframes fly{
    0%{opacity:0;transform:translate3d(var(--fx),var(--fy),0) scale(.94)}
    35%{opacity:1}
    100%{opacity:1;transform:translate3d(0,0,0) scale(1)}
  }
  @keyframes float{
    from{transform:translate3d(0,0,0)}
    to  {transform:translate3d(var(--ax),var(--ay),0)}
  }

  /* лёгкая «камера»: чуть приближено → отъезд */
  .play #zoom{animation:zoom 2.6s var(--ease-out) both}
  @keyframes zoom{from{transform:scale(1.08)}to{transform:scale(1)}}

  /* ── виньетка для глубины ── */
  #vig{position:absolute;inset:0;pointer-events:none;
       background:radial-gradient(120% 80% at 50% 45%,transparent 55%,rgba(70,0,0,.35) 100%)}

  /* ── текст ── */
  #title{position:absolute;left:0;right:0;top:350px;text-align:center;
         font-family:'Yeseva One','Playfair Display',Georgia,serif;
         filter:drop-shadow(0 3px 0 rgba(110,0,0,.55)) drop-shadow(0 8px 18px rgba(60,0,0,.55));
         pointer-events:none}
  .word{display:block;white-space:nowrap}
  #w1{font-size:54px;letter-spacing:.07em;line-height:1;margin-right:-.07em}
  #w2{font-size:168px;letter-spacing:.04em;line-height:1;margin-top:6px;margin-right:-.04em}
  .ch{display:inline-block;position:relative;opacity:0;
      color:transparent;
      background:linear-gradient(180deg,var(--gold-1) 0%,var(--gold-2) 30%,var(--gold-3) 62%,var(--gold-4) 100%);
      -webkit-background-clip:text;background-clip:text;
      transform:translateY(26px) scale(.92);filter:blur(10px)}
  .ch::after{content:attr(data-c);position:absolute;left:0;top:0;color:transparent;
      background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.95) 50%,transparent 62%);
      background-size:300% 100%;background-position:130% 0;
      -webkit-background-clip:text;background-clip:text}
  .play .ch{animation:letter .9s var(--ease-out) forwards;animation-delay:var(--cd)}
  .play .ch::after{animation:shine 1.1s ease-in-out forwards;animation-delay:var(--sd)}
  @keyframes letter{to{opacity:1;transform:none;filter:blur(0)}}
  @keyframes shine{from{background-position:130% 0}to{background-position:-30% 0}}
  #w2 .ch{transform:translateY(40px) scale(.7)}

  /* искры */
  .sp{position:absolute;width:var(--s);height:var(--s);pointer-events:none;opacity:0;
      background:radial-gradient(circle,#fff 0 12%,rgba(255,230,150,.9) 30%,transparent 70%);
      clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%)}
  .play .sp{animation:tw 2.2s ease-in-out infinite;animation-delay:var(--td)}
  @keyframes tw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}

  @media (prefers-reduced-motion:reduce){
    .play .fly,.play .ch{animation-duration:.01s;animation-delay:0s}
    .play .fly .float,.play .sp,.play #zoom{animation:none}
  }

  /* ───────── экран выбора месяца ───────── */
  #stage{transition:filter .9s ease}
  .months-on #stage{filter:blur(3px) brightness(.52) saturate(1.05)}
  .months-on #title,.months-on #sparks{opacity:0;transition:opacity .5s ease}
  #months{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
          padding:max(env(safe-area-inset-top),28px) 16px max(env(safe-area-inset-bottom),20px);
          opacity:0;visibility:hidden;pointer-events:none;overflow-y:auto;
          font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
          color:#fff3d6;-webkit-tap-highlight-color:transparent}
  .months-on #months{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .7s ease .25s}
  .m-wrap{width:100%;max-width:440px;margin:auto 0;display:flex;flex-direction:column}
  .eyebrow{align-self:center;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold-2);
           display:flex;align-items:center;gap:12px;opacity:.95}
  .eyebrow::before,.eyebrow::after{content:"";width:28px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-2))}
  .eyebrow::after{transform:scaleX(-1)}
  .m-title{font-family:'Yeseva One',Georgia,serif;font-weight:400;text-align:center;
           font-size:clamp(26px,7.4vw,34px);line-height:1.18;margin:14px 4px 26px;
           background:linear-gradient(180deg,var(--gold-1),var(--gold-2) 55%,var(--gold-3));
           -webkit-background-clip:text;background-clip:text;color:transparent;
           filter:drop-shadow(0 2px 10px rgba(60,0,0,.5))}
  .m-sub{text-align:center;font-size:14px;color:rgba(255,236,200,.78);margin:0 0 22px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .mon{appearance:none;-webkit-appearance:none;font:inherit;color:inherit;cursor:pointer;
       position:relative;min-height:84px;padding:12px 6px 10px;border-radius:18px;
       border:1px solid rgba(246,210,122,.42);
       background:linear-gradient(180deg,rgba(150,8,8,.55),rgba(95,0,0,.55));
       -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
       box-shadow:inset 0 1px 0 rgba(255,236,190,.18),0 6px 16px rgba(50,0,0,.35);
       display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
       opacity:0;transform:translateY(14px);
       transition:transform .18s ease,background .25s ease,border-color .25s ease,box-shadow .25s ease,color .2s ease}
  .months-on .mon{animation:cardin .6s var(--ease-out) forwards;animation-delay:calc(.45s + var(--i) * 45ms)}
  @keyframes cardin{to{opacity:1;transform:none}}
  .mon .n{font-size:11px;letter-spacing:.18em;color:var(--gold-2);opacity:.85;font-variant-numeric:tabular-nums}
  .mon .t{font-family:'Yeseva One',Georgia,serif;font-size:clamp(15px,4.4vw,18px);line-height:1.1}
  .mon:active{transform:scale(.96)}
  .mon:focus-visible{outline:2px solid var(--gold-1);outline-offset:2px}
  .mon[aria-pressed="true"]{
       background:linear-gradient(180deg,var(--gold-1),var(--gold-2) 45%,var(--gold-3));
       border-color:#fff1bf;color:#6a0000;
       box-shadow:0 0 0 3px rgba(255,226,150,.28),0 10px 26px rgba(255,190,70,.38)}
  .mon[aria-pressed="true"] .n{color:#8a1a00;opacity:.8}
  .cta{appearance:none;-webkit-appearance:none;font:inherit;width:100%;height:56px;margin-top:22px;border:0;border-radius:18px;
       font-size:17px;font-weight:700;letter-spacing:.02em;cursor:pointer;
       color:#6a0000;background:linear-gradient(180deg,var(--gold-1),var(--gold-2) 50%,var(--gold-3));
       box-shadow:0 10px 28px rgba(255,190,70,.35),inset 0 1px 0 rgba(255,255,255,.6);
       transition:transform .15s ease,opacity .25s ease,filter .25s ease}
  .cta:active{transform:scale(.98)}
  .cta[disabled]{opacity:.62;filter:saturate(.5);box-shadow:none;cursor:default}
  .cta:focus-visible{outline:2px solid #fff;outline-offset:3px}
  .toast{position:fixed;left:50%;bottom:max(env(safe-area-inset-bottom),22px);transform:translate(-50%,20px);
         background:rgba(40,0,0,.9);color:var(--gold-1);border:1px solid rgba(246,210,122,.5);
         padding:12px 18px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;
         transition:opacity .3s ease,transform .3s ease;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (max-height:700px){.mon{min-height:70px}}
  @media (prefers-reduced-motion:reduce){.months-on .mon{animation-duration:.01s;animation-delay:0s}}

  /* ───────── экран прогноза ───────── */
  .months-on.fc-on #months{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s ease,visibility 0s .35s}
  #forecast{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
            padding:max(env(safe-area-inset-top),14px) 16px max(env(safe-area-inset-bottom),28px);
            opacity:0;visibility:hidden;pointer-events:none;
            font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#fff3d6}
  .months-on.fc-on #forecast{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .5s ease .2s}
  .f-wrap{max-width:440px;margin:0 auto}
  .f-top{display:flex;align-items:center;justify-content:space-between;min-height:48px}
  .back{appearance:none;-webkit-appearance:none;font:inherit;display:flex;align-items:center;gap:6px;height:44px;padding:0 14px 0 8px;
        background:rgba(100,0,0,.45);border:1px solid rgba(246,210,122,.4);border-radius:22px;color:var(--gold-1);font-size:15px;cursor:pointer;
        -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .back svg{width:22px;height:22px}
  .back:active{transform:scale(.96)}
  .back:focus-visible{outline:2px solid var(--gold-1);outline-offset:2px}
  .f-eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-2)}
  .f-title{font-family:'Yeseva One',Georgia,serif;font-weight:400;text-align:center;font-size:clamp(34px,10vw,44px);line-height:1.1;margin:14px 0 4px;
           background:linear-gradient(180deg,var(--gold-1),var(--gold-2) 55%,var(--gold-3));-webkit-background-clip:text;background-clip:text;color:transparent;
           filter:drop-shadow(0 2px 10px rgba(60,0,0,.5))}
  .f-theme{text-align:center;font-size:15px;color:rgba(255,236,200,.85);margin:0 0 14px}
  .test-badge{display:flex;width:max-content;max-width:100%;margin:0 auto 18px;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;
              background:rgba(255,226,150,.14);border:1px dashed rgba(255,226,150,.7);color:var(--gold-1);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
  .test-badge i{width:7px;height:7px;transform:rotate(45deg);background:var(--gold-2);display:block}
  .card{border-radius:22px;padding:18px;margin-bottom:12px;border:1px solid rgba(246,210,122,.34);
        background:linear-gradient(180deg,rgba(150,8,8,.52),rgba(90,0,0,.55));
        -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
        box-shadow:inset 0 1px 0 rgba(255,236,190,.16),0 8px 22px rgba(40,0,0,.35)}
  .card h3{margin:0 0 12px;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-2)}
  .fc-on .rv{opacity:0;animation:cardin .6s var(--ease-out) forwards;animation-delay:calc(.35s + var(--r,0) * 90ms)}
  .score{display:flex;align-items:center;gap:18px}
  .ring{position:relative;width:112px;height:112px;flex:none}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:9;stroke-linecap:round}
  .ring .tr{stroke:rgba(255,226,150,.18)}
  .ring .pg{stroke:url(#gg);stroke-dasharray:326.7;stroke-dashoffset:var(--off,326.7)}
  .fc-on .ring .pg{animation:ring 1.4s var(--ease-out) .6s backwards}
  @keyframes ring{from{stroke-dashoffset:326.7}}
  .ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Yeseva One',Georgia,serif;font-weight:400;font-size:30px;color:var(--gold-1)}
  .ring b small{font-size:15px;margin:6px 0 0 2px;opacity:.8}
  .score p{margin:0;font-size:14.5px;line-height:1.5;color:rgba(255,240,215,.92)}
  .score p strong{display:block;font-family:'Yeseva One',Georgia,serif;font-weight:400;font-size:18px;color:var(--gold-1);margin-bottom:4px}
  .sph{margin-bottom:15px}.sph:last-child{margin-bottom:0}
  .sph .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;font-size:15px}
  .sph .row span:last-child{font-variant-numeric:tabular-nums;color:var(--gold-1);font-weight:600}
  .bar{height:8px;border-radius:8px;background:rgba(255,226,150,.16);overflow:hidden}
  .bar i{display:block;height:100%;width:var(--w);border-radius:8px;background:linear-gradient(90deg,var(--gold-3),var(--gold-1))}
  .fc-on .bar i{animation:bar 1.1s var(--ease-out) .7s backwards}
  @keyframes bar{from{width:0}}
  .sph small{display:block;margin-top:6px;font-size:12.5px;color:rgba(255,236,200,.65)}
  .days{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.days:last-child{margin-bottom:0}
  .days .lbl{width:100%;font-size:13px;color:rgba(255,236,200,.75);margin-bottom:-2px}
  .day{min-width:44px;height:44px;padding:0 6px;display:grid;place-items:center;border-radius:14px;font-weight:600;font-variant-numeric:tabular-nums}
  .day.good{background:linear-gradient(180deg,var(--gold-1),var(--gold-2));color:#6a0000}
  .day.warn{background:rgba(30,0,0,.45);border:1px solid rgba(255,226,150,.4);color:var(--gold-1)}
  .quote{font-family:'Yeseva One',Georgia,serif;font-size:18px;line-height:1.4;color:var(--gold-1);margin:0}
  .f-foot{text-align:center;font-size:12.5px;color:rgba(255,236,200,.6);margin:16px 8px 0;line-height:1.5}
  .again{appearance:none;-webkit-appearance:none;font:inherit;display:block;width:100%;height:52px;margin-top:14px;border-radius:16px;
         background:transparent;border:1px solid rgba(246,210,122,.55);color:var(--gold-1);font-size:16px;cursor:pointer}
  .again:active{transform:scale(.98)}
  .again:focus-visible{outline:2px solid var(--gold-1);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){.fc-on .rv,.fc-on .ring .pg,.fc-on .bar i{animation-duration:.01s;animation-delay:0s}}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="zoom">
    <img id="bg" src="anim/bg.jpg" alt="">

    <!-- облака (позиции взяты из исходной картинки) -->
    <div class="fly" style="left:0;top:0;--fx:-150px;--fy:-90px;--d:0s">
      <div class="float" style="--ax:-12px;--ay:-8px;--ft:7s"><img src="anim/tl.png" alt="" style="width:404px"></div></div>
    <div class="fly" style="left:450px;top:0;--fx:160px;--fy:-70px;--d:.1s">
      <div class="float" style="--ax:11px;--ay:-7px;--ft:6s;--fd:-2s"><img src="anim/tr.png" alt="" style="width:190px"></div></div>
    <div class="fly" style="left:423px;top:161px;--fx:190px;--fy:30px;--d:.05s">
      <div class="float" style="--ax:12px;--ay:-9px;--ft:8s;--fd:-1s"><img src="anim/right.png" alt="" style="width:217px"></div></div>
    <div class="fly" style="left:0;top:700px;--fx:-170px;--fy:60px;--d:.15s">
      <div class="float" style="--ax:-14px;--ay:-5px;--ft:5.5s;--fd:-3s"><img src="anim/swirl.png" alt="" style="width:179px"></div></div>
    <div class="fly" style="left:0;top:785px;--fx:-190px;--fy:40px;--d:.2s">
      <div class="float" style="--ax:-11px;--ay:6px;--ft:7.5s;--fd:-4s"><img src="anim/left.png" alt="" style="width:224px"></div></div>

    <div id="vig"></div>
    <div id="sparks"></div>
    <div id="title">
      <span class="word" id="w1" aria-label="Прогностика"></span>
      <span class="word" id="w2" aria-label="2027"></span>
    </div>
  </div>
</div>

  <section id="forecast" aria-label="Прогноз">
    <div class="f-wrap">
      <div class="f-top">
        <button class="back" id="back" type="button" aria-label="Назад до вибору місяця"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Місяці</button>
        <span class="f-eyebrow">Прогностика 2027</span>
      </div>
      <h2 class="f-title" id="f-title"></h2>
      <p class="f-theme" id="f-theme"></p>
      <div class="test-badge"><i></i>Тестові дані</div>
      <div id="f-body"></div>
      <p class="f-foot">Усі тексти та цифри на цьому екрані — тестові. Так виглядатиме прогноз у застосунку.</p>
      <button class="again" id="again" type="button">Обрати інший місяць</button>
    </div>
  </section>
  <section id="months" aria-label="Вибір місяця">
    <div class="m-wrap">
      <div class="eyebrow">Прогностика 2027</div>
      <h1 class="m-title">Обирай місяць, щоб отримати прогноз</h1>
      <div class="grid" id="grid" role="group" aria-label="Місяць 2027 року"></div>
    </div>
  </section>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3c4"/><stop offset="1" stop-color="#d9a441"/></linearGradient></defs></svg>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
(function(){
  var stage=document.getElementById('stage');
  function fit(){
    var r=document.getElementById('wrap').getBoundingClientRect(),w=r.width||innerWidth,h=r.height||innerHeight;
    var s=Math.max(w/640,h/1280)*1.015;
    stage.style.transform='translate('+((w-640*s)/2)+'px,'+((h-1280*s)/2)+'px) scale('+s+')';
  }
  addEventListener('resize',fit);addEventListener('load',fit);
  if(window.ResizeObserver)new ResizeObserver(fit).observe(document.getElementById('wrap'));
  if(window.visualViewport)visualViewport.addEventListener('resize',fit);
  fit();

  function build(id,text,t0,step){
    var el=document.getElementById(id);el.textContent='';
    text.split('').forEach(function(c,i){
      var s=document.createElement('span');s.className='ch';s.dataset.c=c;s.textContent=c;
      s.style.setProperty('--cd',(t0+i*step)+'s');
      s.style.setProperty('--sd',(t0+1.0+i*.07)+'s');
      el.appendChild(s);
    });
  }
  build('w1','ПРОГНОСТИКА',.55,.055);
  build('w2','2027',1.05,.12);

  // искры вокруг текста
  var sp=document.getElementById('sparks');
  var pts=[[110,410],[540,395],[70,560],[575,540],[200,350],[450,345],[320,320],[130,690],[520,660],[300,640],[600,480],[40,480]];
  pts.forEach(function(p,i){
    var d=document.createElement('div');d.className='sp';
    d.style.left=p[0]+'px';d.style.top=p[1]+'px';
    d.style.setProperty('--s',(14+(i%4)*7)+'px');
    d.style.setProperty('--td',(1.6+i*.23)+'s');
    sp.appendChild(d);
  });

  function play(){
    stage.classList.remove('play');void stage.offsetWidth;stage.classList.add('play');
  }
  window.replay=play;
  var wrap=document.getElementById('wrap'),timer,started=false;
  var MONTHS=['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
  var THEMES=['Чистий аркуш','Тиха підготовка','Місяць нових починань','Розквіт ідей','Гармонія та тепло','Швидкість і рух','Час сміливих рішень','Золотий урожай','Фокус і порядок','Несподівані можливості','Глибина та спокій','Підсумки та свято'];
  var DAYS=[31,28,31,30,31,30,31,31,30,31,30,31];
  function rnd(i,k){var x=Math.sin((i+1)*12.9898+k*78.233)*43758.5453;return x-Math.floor(x)}
  function pick(i,n,k0,cnt,used){var out=[],k=k0;while(out.length<cnt){var d=1+Math.floor(rnd(i,k++)*n);if(out.indexOf(d)<0&&used.indexOf(d)<0)out.push(d)}return out.sort(function(a,b){return a-b})}

  function buildForecast(i){
    var score=58+Math.round(rnd(i,1)*34);
    var sph=[['Кохання','Тестовий опис: тут буде коротка порада щодо стосунків.'],['Гроші','Тестовий опис: тут буде порада щодо фінансів.'],['Кар’єра','Тестовий опис: тут буде порада щодо роботи.'],['Здоров’я','Тестовий опис: тут буде порада щодо самопочуття.']]
      .map(function(x,k){return {n:x[0],t:x[1],v:48+Math.round(rnd(i,10+k)*47)}});
    var good=pick(i,DAYS[i],30,4,[]),warn=pick(i,DAYS[i],60,2,good);
    document.getElementById('f-title').textContent=MONTHS[i]+' 2027';
    document.getElementById('f-theme').textContent=THEMES[i];
    var C=326.7,off=(C*(1-score/100)).toFixed(1);
    var h='';
    h+='<div class="card rv" style="--r:0"><h3>Загальна енергія місяця</h3><div class="score"><div class="ring"><svg viewBox="0 0 120 120"><circle class="tr" cx="60" cy="60" r="52"/><circle class="pg" cx="60" cy="60" r="52" style="--off:'+off+'"/></svg><b>'+score+'<small>%</small></b></div>'
      +'<p><strong>'+THEMES[i]+'</strong>Тестовий текст прогнозу. Тут буде короткий опис місяця: на чому зосередитись і які рішення приймати.</p></div></div>';
    h+='<div class="card rv" style="--r:1"><h3>Сфери життя</h3>'+sph.map(function(s){
      return '<div class="sph"><div class="row"><span>'+s.n+'</span><span>'+s.v+'%</span></div><div class="bar"><i style="--w:'+s.v+'%"></i></div><small>'+s.t+'</small></div>'}).join('')+'</div>';
    h+='<div class="card rv" style="--r:2"><h3>Ключові дати</h3><div class="days"><span class="lbl">Сприятливі дні</span>'+good.map(function(d){return '<span class="day good">'+d+'</span>'}).join('')+'</div>'
      +'<div class="days"><span class="lbl">Дні для обережності</span>'+warn.map(function(d){return '<span class="day warn">'+d+'</span>'}).join('')+'</div></div>';
    h+='<div class="card rv" style="--r:3"><h3>Порада місяця</h3><p class="quote">«Тестова порада: тут буде персональна порада на цей місяць.»</p></div>';
    document.getElementById('f-body').innerHTML=h;
    document.getElementById('forecast').scrollTop=0;
  }

  // ── экран месяцев ──
  var grid=document.getElementById('grid');
  MONTHS.forEach(function(name,i){
    var b=document.createElement('button');b.type='button';b.className='mon';b.setAttribute('aria-pressed','false');
    b.style.setProperty('--i',i);
    b.innerHTML='<span class="n">'+String(i+1).padStart(2,'0')+'</span><span class="t">'+name+'</span>';
    b.addEventListener('click',function(){
      b.setAttribute('aria-pressed','true');
      try{window.Telegram.WebApp.HapticFeedback.selectionChanged()}catch(e){}
      setTimeout(function(){showForecast(i);b.setAttribute('aria-pressed','false')},180);
    });
    grid.appendChild(b);
  });

  function showMonths(){clearTimeout(timer);wrap.classList.add('months-on');wrap.classList.remove('fc-on')}
  function showForecast(i){buildForecast(i);wrap.classList.add('months-on','fc-on');history.replaceState(null,'','#m'+(i+1))}
  function backToMonths(){wrap.classList.remove('fc-on');history.replaceState(null,'',location.pathname+location.search)}
  document.getElementById('back').addEventListener('click',backToMonths);
  document.getElementById('again').addEventListener('click',backToMonths);
  window.showMonths=showMonths;window.showForecast=showForecast;

  // тап по заставке пропускает её
  document.addEventListener('click',function(){
    if(started&&!wrap.classList.contains('months-on')&&location.hash!=='#splash')showMonths();
  });

  // ── запуск: ждём шрифт и картинки, потом заставка, через 2,5 с — выбор месяца ──
  var h=location.hash,mm=/^#m(\d{1,2})$/.exec(h);
  function imgsReady(){
    var p=[].map.call(document.images,function(im){return im.decode?im.decode().catch(function(){}):Promise.resolve()});
    return Promise.all(p);
  }
  function fontReady(){
    var f=(document.fonts&&document.fonts.load)?document.fonts.load('60px "Yeseva One"','ПРОГНОСТИКАпрогноз2027іїє').catch(function(){}):Promise.resolve();
    return Promise.race([f,new Promise(function(r){setTimeout(r,2500)})]);
  }
  Promise.all([fontReady(),imgsReady()]).then(function(){
    play();started=true;
    if(mm&&+mm[1]>=1&&+mm[1]<=12){showForecast(+mm[1]-1)}
    else if(h==='#months'){showMonths()}
    else if(h!=='#splash'){timer=setTimeout(showMonths,2500)}
  });
})();
</script>
</body>
</html>
